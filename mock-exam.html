<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N4 完整模擬卷</title>
<link rel="icon" type="image/webp" href="img/logo.webp">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
* { box-sizing: border-box; }
body { font-family: "Noto Sans TC", "PingFang TC", sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
.container { max-width: 800px; margin: 0 auto; }
.card { background: #fff; border-radius: 16px; padding: 24px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
h1 { font-family: "Noto Sans TC", "PingFang TC", sans-serif; font-size: 50px; text-align: center; margin: 24px 0 10px; letter-spacing: 2px; font-weight: 900; color: #111; line-height: 1.2; }
h2 { font-size: 22px; margin: 0 0 12px 0; }
.hint { color: #666; font-size: 15px; line-height: 1.6; }
.btn { display: inline-block; padding: 14px 32px; font-size: 18px; border: none; border-radius: 30px; background: #111; color: #fff; cursor: pointer; margin: 10px 5px 0 0; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn2 { background: #4a90d9; }
.timer { font-size: 32px; font-weight: bold; color: #d32f2f; text-align: center; margin: 16px 0; }
.qblock { border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px; margin: 12px 0; }
.qtext { font-size: 17px; line-height: 1.7; margin-bottom: 10px; }
.opt { display: block; padding: 10px 12px; margin: 6px 0; border: 1px solid #e0e0e0; border-radius: 8px; cursor: pointer; font-size: 16px; }
.opt:hover { background: #f5f5f5; }
.opt input { margin-right: 8px; }
.correct { background: #e8f5e9; border-color: #4caf50; }
.wrong { background: #ffebee; border-color: #f44336; }
.explain { background: #fff8e1; border-radius: 8px; padding: 12px; margin-top: 10px; font-size: 15px; line-height: 1.6; }
.score { font-size: 24px; text-align: center; margin: 20px 0; }
.section-nav { text-align: center; margin: 20px 0; }
.progress { text-align: center; color: #666; margin: 10px 0; }

  ruby { font-size: 1em; font-weight: inherit; ruby-align: center; ruby-position: over; }
  ruby rt {
    font-size: 0.5em; color: #222; font-weight: 300; line-height: 1;
    text-align: center; display: block; width: 100%;
  }
  .qtext, .opt { font-weight: 700; }
  .qtext *, .opt * { font-weight: 700 !important; }
  .qtext rt, .opt rt { font-weight: 300 !important; }

</style>
</head>
<body>
<div class="container">
  <div class="card" id="introCard">
    <h1>N4 完整模擬卷</h1><div style="text-align:center;color:#999;font-size:12px">v20261019-v24</div>
    <div class="hint">
      和正式 JLPT N4 考試一樣，分三部分計時：<br>
      • <b>言語知識（文字・語彙）</b>：25 分鐘<br>
      • <b>言語知識（文法）・読解</b>：55 分鐘<br>
      • <b>聴解</b>：35 分鐘<br><br>
      做完一部分可以休息，再按開始做下一部分。<br>
      交卷後即時顯示答案同講解。
    </div>
    <div style="margin-top:16px">
      <label style="font-size:16px;margin-right:12px">你是：</label>
      <button class="btn" onclick="selectUser('許悅')">許悅</button>
      <button class="btn" onclick="selectUser('許逸')">許逸</button>
      <button class="btn" onclick="selectUser('GOBI')">GOBI</button>
    </div>
    <div id="userMsg" style="margin-top:10px;color:#666"></div>
  </div>

  <div class="card" id="sectionCard" style="display:none">
    <h2 id="sectionTitle"></h2>
    <div class="timer" id="timer"></div>
    <div class="progress" id="progress"></div>
    <div id="questions"></div>
    <div class="section-nav">
      <button class="btn" id="submitBtn" onclick="submitSection()">交卷</button>
    </div>
  </div>

  <div class="card" id="breakCard" style="display:none">
    <h2>休息一下 ☕</h2>
    <div class="hint" id="breakMsg"></div>
    <button class="btn btn2" id="nextBtn" onclick="startNextSection()">開始下一部分</button>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>成績</h2>
    <div class="score" id="finalScore"></div>
    <div id="review"></div>
    <button class="btn" onclick="location.href='index.html'">返主頁</button>
  </div>
</div>

<script>
// 從主頁載入題庫
var QBANK = [];
var currentUser = null;
/* ---------- 分數後端（同 index.html 一樣：Cloudflare Worker + KV，可靠） ---------- */
var SCORE_API = 'https://jlpt-scores.hoo-c27.workers.dev/submit';
function postScore(data){
  try{
    var backup = JSON.parse(localStorage.getItem('score_backup')||'[]');
    backup.push({data:data, time:new Date().toISOString(), synced:false});
    localStorage.setItem('score_backup', JSON.stringify(backup));
  }catch(e){}
  var tries = 0;
  function attempt(){
    tries++;
    fetch(SCORE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
      .then(function(r){
        if(r.ok){
          try{
            var b = JSON.parse(localStorage.getItem('score_backup')||'[]');
            b.forEach(function(item){
              if(JSON.stringify(item.data)===JSON.stringify(data)) item.synced = true;
            });
            localStorage.setItem('score_backup', JSON.stringify(b));
          }catch(e){}
        }else if(tries < 3){ setTimeout(attempt, 2000); }
      })
      .catch(function(){ if(tries < 3) setTimeout(attempt, 2000); });
  }
  attempt();
}
var sections = [
  { id: 'vocab', name: '言語知識（文字・語彙）', mins: 25, filter: function(q){ return q.section==='vocab'; } },
  { id: 'gram_read', name: '言語知識（文法）・読解', mins: 55, filter: function(q){ return q.section==='grammar' || q.section==='reading'; } },
  { id: 'listening', name: '聴解', mins: 35, filter: function(q){ return q.section==='listening'; } },
];
var secIdx = 0;
var secQuestions = [];
var secAnswers = {};
var allResults = [];
var timerInt = null;

var examLevel = 'MIX';
// 從 URL 參數攞 level 同 user
try{
  var pm = new URLSearchParams(window.location.search);
  var lv = pm.get('level');
  if(lv && ['N5','N4','N3','MIX'].indexOf(lv)>=0) examLevel = lv;
  var u = pm.get('user');
  if(u){
    currentUser = decodeURIComponent(u);
    // 自動開始，唔使再揀人
    window.addEventListener('load', function(){
      document.getElementById('introCard').innerHTML = '<h1>N4 完整模擬卷</h1><div class="hint">考生：<b>'+currentUser+'</b><br><br>和正式 JLPT N4 考試一樣，分三部分計時：<br>• <b>言語知識（文字・語彙）</b>：25 分鐘<br>• <b>言語知識（文法）・読解</b>：55 分鐘<br>• <b>聴解</b>：35 分鐘<br><br>做完一部分可以休息，再按開始做下一部分。<br>交卷後即時顯示答案同講解。</div><button class="btn btn2" onclick="startMock()">開始模擬考</button>';
    });
  }
}catch(e){}

function selectUser(name){
  currentUser = name;
  document.getElementById('userMsg').textContent = '已選擇：' + name + '，按下面開始。';
  // 顯示開始按鈕
  if(!document.getElementById('startBtn')){
    var b = document.createElement('button');
    b.id = 'startBtn';
    b.className = 'btn btn2';
    b.textContent = '開始模擬考';
    b.onclick = startMock;
    document.getElementById('introCard').appendChild(b);
  }
}

function loadQBank(cb){
  if(QBANK.length){ cb(); return; }
  fetch('question_bank.json').then(function(r){ return r.json(); }).then(function(d){
    QBANK = d.questions || d;
    cb();
  });
}

function startMock(){
  if(!currentUser){ alert('請先選擇使用者'); return; }
  document.getElementById('introCard').style.display = 'none';
  secIdx = 0;
  allResults = [];
  startSection();
}

var USER_MIX = {
  '許悅': { base: 'N4', extra: 'N5', ratio: 0.3 },
  '許逸': { base: 'N4', extra: 'N3', ratio: 0.3 },
  'GOBI': { base: 'N3', extra: 'N4', ratio: 0.3 }
};
function seededRand(seedStr){
  var h = 1779033703;
  for(var i=0;i<seedStr.length;i++){ h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  return function(){
    h = Math.imul(h ^ (h>>>16), 2246822507);
    h = Math.imul(h ^ (h>>>13), 3266489909);
    return ((h ^= h>>>16) >>> 0) / 4294967296;
  };
}
function shuffleSeeded(a, rand){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(rand()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function startSection(){
  var sec = sections[secIdx];
  document.getElementById('breakCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('sectionCard').style.display = 'block';
  document.getElementById('sectionTitle').textContent = '第 ' + (secIdx+1) + '/3 部分：' + sec.name;

  loadQBank(function(){
    // 按程度分流：seed 按考生+日期（兩姊妹唔會撞同一份卷）；程度配比按 USER_MIX
    var prof = USER_MIX[currentUser] || null;
    var mainLevel = (examLevel === 'MIX') ? (prof ? prof.base : 'N4') : examLevel;
    var target = sec.id==='vocab' ? 20 : (sec.id==='gram_read' ? 30 : 25);
    var extraLevel = null, extraN = 0;
    if(prof && (examLevel === 'MIX' || examLevel === prof.base)){
      extraLevel = prof.extra;
      extraN = Math.round(target * prof.ratio);
    }
    var rand = seededRand((currentUser||'unknown') + '|' + new Date().toISOString().slice(0,10) + '|' + mainLevel + '|' + sec.id);
    function pickFrom(level, n){
      if(n <= 0) return [];
      var pool = QBANK.filter(function(q){
        return !q.needs_image && sec.filter(q) && q.level === level;
      });
      var groups = {}, singles = [];
      pool.forEach(function(q){
        if(q.group){ (groups[q.group]=groups[q.group]||[]).push(q); }
        else singles.push(q);
      });
      Object.keys(groups).forEach(function(g){
        groups[g].sort(function(a,b){ return (a.qnum||0)-(b.qnum||0); });
      });
      var groupList = Object.keys(groups).map(function(g){ return groups[g]; });
      groupList = shuffleSeeded(groupList, rand);
      singles = shuffleSeeded(singles, rand);
      var picked = [];
      groupList.forEach(function(g){
        if(picked.length + g.length <= n + 2) picked = picked.concat(g);
      });
      var need = n - picked.length;
      if(need > 0) picked = picked.concat(singles.slice(0, need));
      return picked;
    }
    var picked = pickFrom(mainLevel, target - extraN);
    if(extraLevel) picked = picked.concat(pickFrom(extraLevel, extraN));
    if(picked.length < target){
      var usedIds = {}; picked.forEach(function(q){ usedIds[q.id] = 1; });
      var rest = QBANK.filter(function(q){
        return !q.needs_image && !q.group && sec.filter(q) && !usedIds[q.id] && (q.level === mainLevel || q.level === extraLevel);
      });
      picked = picked.concat(shuffleSeeded(rest, rand).slice(0, target - picked.length));
    }
    secQuestions = picked;
    // 記錄實際 level（家長睇）
    console.log('Mock exam level:', examLevel, 'section:', sec.id, 'count:', picked.length);
    secAnswers = {};
    renderQuestions();
    startTimer(sec.mins * 60);
  });
}

function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

var qStartTimes = {};
function renderQuestions(){
  var html = '';
  secQuestions.forEach(function(q, i){
    qStartTimes[i] = Date.now();
    html += '<div class="qblock">' + (q.img && q.section==='reading' ? '<div><img src="' + q.img + '" style="max-width:100%"></div>' : '') + '<div class="qtext"><b>Q' + (i+1) + '.</b> ' + rubyText(q.question, getReadingTarget(q.question), isReadingQ(q.question)).replace(/\n/g,'<br>') + '</div>';
    if(q.img && q.section!=='reading') html += '<div><img src="' + q.img + '" style="max-width:100%"></div>';
    if(q.audio) html += '<div><audio controls src="audio/' + q.audio + '" style="width:100%"></audio></div>';
    q.options.forEach(function(op, j){
      html += '<label class="opt"><input type="radio" name="q'+i+'" value="'+(j+1)+'" onchange="answerQ('+i+','+(j+1)+')"> ' + optRuby(q, op, true) + '</label>';
    });
    html += '</div>';
  });
  document.getElementById('questions').innerHTML = html;
  document.getElementById('progress').textContent = '共 ' + secQuestions.length + ' 題';
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var qAnswerTimes = {};
function answerQ(i, val){
  secAnswers[i] = val;
  var elapsed = (Date.now() - (qStartTimes[i]||Date.now())) / 1000;
  qAnswerTimes[i] = elapsed;
  // 少於8秒作答視為猜題
  if(elapsed < 8){
    console.log('Q'+(i+1)+' 可能係猜 ('+elapsed.toFixed(1)+'s)');
  }
  // 逐題即時送後端：做一題，後端就收到一題
  try{
    var q = secQuestions[i] || {};
    postScore({type:'mock_answer', who:currentUser||'unknown',
      date:new Date().toISOString().slice(0,10),
      key:(q.id||('mock_q'+i)), answer:val,
      section:(sections[secIdx]||{}).id||'', level:examLevel});
  }catch(e){}
}

function startTimer(seconds){
  clearInterval(timerInt);
  var remain = seconds;
  function tick(){
    var m = Math.floor(remain/60), s = remain%60;
    document.getElementById('timer').textContent = '⏰ ' + m + ':' + (s<10?'0':'') + s;
    if(remain<=0){ clearInterval(timerInt); submitSection(true); return; }
    remain--;
  }
  tick();
  timerInt = setInterval(tick, 1000);
}

function submitSection(auto){
  clearInterval(timerInt);
  var sec = sections[secIdx];
  var correct = 0;
  var results = [];
  secQuestions.forEach(function(q, i){
    var ua = secAnswers[i] || 0;
    var ok = (ua === q.answer);
    if(ok) correct++;
    var elapsed = qAnswerTimes[i] || 0;
    var guessed = ok && elapsed < 8; // 答對但好快=猜對
    results.push({ q: q, userAns: ua, correct: ok, time: elapsed, guessed: guessed });
  });
  allResults.push({ sec: sec, correct: correct, total: secQuestions.length, results: results });

  document.getElementById('sectionCard').style.display = 'none';

  if(secIdx < sections.length - 1){
    document.getElementById('breakMsg').innerHTML = '完成「' + sec.name + '」：' + correct + '/' + secQuestions.length + ' 答對。<br>休息一下，準備下一部分。';
    document.getElementById('nextBtn').textContent = '開始：' + sections[secIdx+1].name;
    document.getElementById('breakCard').style.display = 'block';
  } else {
    showFinal();
  }
}

function startNextSection(){
  secIdx++;
  startSection();
}

function showFinal(){
  var totalCorrect = 0, totalQ = 0;
  allResults.forEach(function(r){ totalCorrect += r.correct; totalQ += r.total; });
  var pct = Math.round(totalCorrect/totalQ*100);

  // 交卷總分都送後端一份（逐題已送，呢個係總結）
  try{
    postScore({type:'mock_final', who:currentUser||'unknown',
      date:new Date().toISOString().slice(0,10),
      key:'mock_final', score:totalCorrect, total:totalQ, level:examLevel});
  }catch(e){}

  document.getElementById('breakCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('finalScore').innerHTML = '總分：' + totalCorrect + ' / ' + totalQ + ' (' + pct + '%)';

  var html = '';
  allResults.forEach(function(r){
    html += '<h3>' + r.sec.name + '：' + r.correct + '/' + r.total + '</h3>';
    r.results.forEach(function(res, i){
      var q = res.q;
      html += '<div class="qblock">' + (q.img && q.section==='reading' ? '<div><img src="' + q.img + '" style="max-width:100%"></div>' : '') + '<div class="qtext"><b>Q' + (i+1) + '.</b> ' + rubyText(q.question, getReadingTarget(q.question), isReadingQ(q.question)).replace(/\n/g,'<br>') + '</div>';
      q.options.forEach(function(op, j){
        var cls = '';
        if(j+1 === q.answer) cls = 'correct';
        else if(j+1 === res.userAns && !res.correct) cls = 'wrong';
        html += '<div class="opt ' + cls + '">' + (j+1) + '. ' + optRuby(q, op, true) + '</div>';
      });
      if(res.guessed) html += '<div class="explain" style="background:#fff3e0">🎲 猜對！用咗 ' + res.time.toFixed(1) + ' 秒，建議重溫。</div>';
      if(!res.correct) html += '<div class="explain" style="background:#ffebee">❌ 答錯，加入錯題本加強。</div>';
      if(q.explanation) html += '<div class="explain">💡 ' + esc(q.explanation).replace(/\n/g,'<br>') + '</div>';
      html += '</div>';
    });
  });
  document.getElementById('review').innerHTML = html;

  // 儲存成績同錯題
  try{
    var key = 'mockexam_' + currentUser;
    var hist = JSON.parse(localStorage.getItem(key) || '[]');
    hist.push({ date: new Date().toISOString().slice(0,10), score: totalCorrect, total: totalQ });
    localStorage.setItem(key, JSON.stringify(hist));
    // 錯題＋猜對存入錯題本
    var wrongKey = 'wrong_' + currentUser;
    var wrongs = JSON.parse(localStorage.getItem(wrongKey) || '[]');
    allResults.forEach(function(r){
      r.results.forEach(function(res){
        if(!res.correct || res.guessed){
          wrongs.push({ qid: res.q.id, date: new Date().toISOString().slice(0,10), reason: res.guessed ? 'guessed' : 'wrong' });
        }
      });
    });
    localStorage.setItem(wrongKey, JSON.stringify(wrongs));
  }catch(e){}
}
</script>

<script src="readmap-extra.js?v=20261031d"></script>
<script>
// 簡化版 rubyText（用 READMAP_EXTRA）
var READMAP = {};
if(typeof READMAP_EXTRA !== 'undefined'){
  for(var k in READMAP_EXTRA) READMAP[k] = READMAP_EXTRA[k];
}
function isReadingQ(question){ return /「[^」]+」的讀音是？/.test(String(question||'')); }
function optRuby(q, o, useRuby){
  if(typeof USE_FURIFONT !== 'undefined' && USE_FURIFONT) return esc(o);
  var m = String((q && q.question) || '').match(/「([^」]+)」的漢字(寫法)?是？/);
  if(m) return esc(o); // 漢字題：選項唔加振假名（問漢字本身，加讀音＝洩底）
  return useRuby ? rubyText(o) : esc(o);
}
function getReadingTarget(question){
  var m = String(question||'').match(/「([^」]+)」(?:的讀音是？|的漢字是？|的意思)/);
  return m ? m[1] : null;
}
function _starWrap(h){ return h.replace(/★/g,'<span style="text-decoration:underline;text-underline-offset:3px">★</span>'); }
function rubyText(s, skipWord, plain){
  if(USE_FURIFONT) return esc(String(s||'').replace(/⟦([^⟧]+)⟧/g, '$1'));
  if(!s) return '';
  s = String(s);
  var _marks = [];
  s = s.replace(/⟦([^⟧]+)⟧/g, function(_, t){ _marks.push(t); return '\uE000' + (_marks.length - 1) + '\uE001'; });
  function _restoreMarks(h){ return h.replace(/\uE000(\d+)\uE001/g, function(_, i){ return '<span style="color:#d32f2f;font-weight:bold">' + esc(_marks[+i]) + '</span>'; }); }
  if(!/[\u4e00-\u9fff]/.test(s)) return _starWrap(_restoreMarks(esc(s)));
  if(!_rubyKeys){
    _rubyKeys = Object.keys(READMAP).filter(function(k){ return /[\u4e00-\u9fff]/.test(k); });
    _rubyKeys.sort(function(a,b){ return b.length - a.length; });
  }
  // 按標點/括號分段，只對含假名嘅段加振假名（中文唔加）
  var segments = s.split(/([「」『』（）()？?。、])/);
  var result = '';
  for(var si=0; si<segments.length; si++){
    var seg = segments[si];
    if(!seg) continue;
    if(!/[\u3040-\u309f\u30a0-\u30ff]/.test(seg)){
      var segHtml = esc(seg);
      if(!plain && READMAP[seg]) segHtml = '<ruby>' + esc(seg) + '<rt>' + esc(READMAP[seg]) + '</rt></ruby>';
      if(skipWord && seg === skipWord) segHtml = '<span style="color:#d32f2f;font-weight:bold">' + segHtml + '</span>';
      result += segHtml;
      continue;
    }
    var out = '', i = 0;
    var hasTarget = skipWord && seg.indexOf(skipWord) >= 0;
    while(i < seg.length){
      if(hasTarget && seg.substr(i, skipWord.length) === skipWord){
        var endT = i + skipWord.length;
        if(skipWord.length === 1 && /[\u4e00-\u9fff]/.test(skipWord)){
          var STOPC = 'はがをにへとやのでは、。！？';
          while(endT < seg.length && /[\u3041-\u3096]/.test(seg[endT]) && STOPC.indexOf(seg[endT]) < 0) endT++;
        }
        var spanTxt = seg.substring(i, endT);
        var spanHtml = esc(spanTxt);
        if(!plain){
          if(READMAP[spanTxt]) spanHtml = '<ruby>' + esc(spanTxt) + '<rt>' + esc(READMAP[spanTxt]) + '</rt></ruby>';
          else if(READMAP[skipWord] && spanTxt.indexOf(skipWord) === 0) spanHtml = '<ruby>' + esc(skipWord) + '<rt>' + esc(READMAP[skipWord]) + '</rt></ruby>' + esc(spanTxt.substring(skipWord.length));
        }
        out += '<span style="color:#d32f2f;font-weight:bold">' + spanHtml + '</span>';
        i = endT;
        continue;
      }
      var matched = false;
      if(!plain) for(var k = 0; k < _rubyKeys.length; k++){
        var word = _rubyKeys[k];
        if(skipWord && (word === skipWord || skipWord.indexOf(word) === 0)) continue;
        if(seg.substr(i, word.length) === word){
          out += '<ruby>'+esc(word)+'<rt>'+esc(READMAP[word])+'</rt></ruby>';
          i += word.length; matched = true; break;
        }
      }
      if(!matched){ out += esc(seg[i]); i++; }
    }
    result += out;
  }
  return _starWrap(_restoreMarks(result));
}
